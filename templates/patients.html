<!DOCTYPE html>
<html>
<head>
    <title>Patients</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h2>Patient List</h2>
    <table border="1">
        <tr>
            <th>ID</th><th>Name</th><th>DOB</th><th>Contact</th><th>Address</th><th>Actions</th>
        </tr>
        {% for pat in patients %}
        <tr>
            <td>{{ pat.PatientID }}</td>
            <td>{{ pat.Name }}</td>
            <td>{{ pat.DOB }}</td>
            <td>{{ pat.Contact }}</td>
            <td>{{ pat.Address }}</td>
            <td>
                <a href="/edit_patient/{{ pat.PatientID }}">Edit</a> |
                <a href="/delete_patient/{{ pat.PatientID }}">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>
    <br>
    <a href="/add_patient">Add New Patient</a><br><br>
    <a href="/home">Back to Home</a>
</body>
</html>
